[project]
name = "payment-investment-allocation"
version = "0.1.0"
description = "Lot-based cashflow and liquidity allocation engine for payments, investments, and intertemporal redemption analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]

dependencies = [
  "pandas",
  "openpyxl",
  "numpy",
  "python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
